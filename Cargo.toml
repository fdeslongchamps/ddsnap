[package]
name = "ddsnap"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "PSD → DDS pour skins Assetto Corsa"
license = "MIT"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
clap = { version = "4.6.7", features = ["derive"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
image_dds = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
